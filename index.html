<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brk | Denemelik Site </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0a0c10;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Arka Plan Hareketli Şekiller ve Parıltılar */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(88, 166, 255, 0.25);
            top: 10%;
            left: 15%;
        }

        .shape-2 {
            width: 350px;
            height: 350px;
            background: rgba(188, 140, 255, 0.2);
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        .cube {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            z-index: 0;
            animation: rotateCube 12s linear infinite;
        }

        .cube-1 { width: 80px; height: 80px; top: 20%; right: 20%; }
        .cube-2 { width: 120px; height: 120px; bottom: 15%; left: 10%; animation-duration: 18s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        @keyframes rotateCube {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ana Kart */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.4);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        p.bio {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Yetenek / İlgi Kutuları */
        .tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #c9d1d9;
        }

        /* Linkler */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #21262d;
            color: #f0f6fc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #58a6ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- Arka Plan Hareketli Elemanları -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="cube cube-1"></div>
    <div class="cube cube-2"></div>

    <!-- Ana Kart -->
    <div class="card">
        <div class="avatar">B</div>
        <h1>Merhaba</h1>
        <div class="badge">Online</div>
        <p class="bio">Deneme</p>
        
        <!-- Etiketler -->
        <div class="tags">
            <span class="tag">🎮 Gaming</span>
            <span class="tag">💻 Hardware</span>
            <span class="tag">⚡ Web Dev</span>
        </div>

        <!-- Butonlar -->
        <div class="links">
            <a href="https://steamcommunity.com" target="_blank" class="btn">https://steamcommunity.com/profiles/76561199390764431/</a>
            <a href="https://www.tiktok.com/" target="_blank" class="btn">https://www.tiktok.com/@burak.tsdn</a>
            <a href="https://instagram.com" target="_blank" class="btn">https://www.instagram.com/burak.tsdn/</a>
        </div>
    </div>

</body>
</html>
