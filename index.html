<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brk | Denemelik Web Sitesi </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
        }

        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.bio {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">B</div>
        <h1>Merhaba</h1>
        <p class="bio">Bu siteye neden girme isteği duydunuz acaba? </p>
        
        <div class="links">
            <a href="https://kick.com/cordiseps" class="btn">Instagram</a>
            <a href="https://www.itemsatis.com/profil/dutdutburak.html" class="btn">Discord Server</a>
            <a href="#" class="btn">Steam Profili</a>
        </div>
    </div>

</body>
</html>
